version: '3.8'

services:
  # MSSQL Server 2022 (developer edition)
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: goodfellaz17-mssql
    environment:
      # Required: accept SQL Server license terms
      ACCEPT_EULA: 'Y'
      # SA password (must be strong: 8+ chars, uppercase, lowercase, numbers, special chars)
      SA_PASSWORD: 'YourStrong@Passw0rd'
      # Optional: MSSQL memory limit
      MSSQL_MEMORY_LIMIT_MB: 2048
    ports:
      - "1433:1433"
    volumes:
      # Persist data between container restarts
      - mssql_data:/var/opt/mssql
      # Initialize database schema on startup (optional)
      # - ./src/main/resources/db/init-mssql.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - goodfellaz17-net
    healthcheck:
      test: ["CMD", "/opt/mssql-tools18/bin/sqlcmd", "-S", "localhost", "-U", "sa", "-P", "YourStrong@Passw0rd", "-Q", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mssql_data:
    driver: local

networks:
  goodfellaz17-net:
    driver: bridge
